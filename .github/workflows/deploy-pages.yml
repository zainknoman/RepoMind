name: Deploy RepoMind to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Verify Pages entry point
        run: test -f frontend/dist/index.html

      - name: Add SPA fallback
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published site
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location "$PAGES_URL" | grep -q '<div id="root">'; then
              echo "GitHub Pages is serving RepoMind at $PAGES_URL"
              exit 0
            fi
            sleep 10
          done
          echo "GitHub Pages did not return the expected RepoMind entry point: $PAGES_URL"
          exit 1
