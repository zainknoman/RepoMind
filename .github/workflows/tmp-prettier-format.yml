name: Temporary Prettier Format

on:
  push:
    branches:
      - tmp/prettier-format-20260929

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format
      - name: Commit formatted files
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.jsx frontend/src/features/editor/Editor.jsx frontend/src/services/githubImport.js frontend/src/services/indexCache.js
          git diff --cached --quiet || git commit -m "Temporary Prettier formatting"
          git push
